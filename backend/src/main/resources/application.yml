server:
  port: ${API_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: careconnect-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:CARECONNECT}
    password: ${SPRING_DATASOURCE_PASSWORD:careconnect-dev-change-me}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
careconnect:
  jwt:
    secret: ${CARECONNECT_JWT_SECRET:local-development-only-careconnect-secret-change-me-2026}
  cors-origins: ${CORS_ORIGIN:http://localhost:4200,http://127.0.0.1:4200}
  production: ${CARECONNECT_PRODUCTION:false}
  legacy-sqlite-path: ${CARECONNECT_SQLITE_IMPORT_PATH:}

services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    container_name: careconnect-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-careconnect-oracle-dev-password}
      APP_USER: CARECONNECT
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-careconnect-dev-change-me}
    volumes:
      - careconnect_oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
volumes:
  careconnect_oracle_data:
